<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>線上課程來賓入口</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;700&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1c1c1e; --ink-soft: #48484a; --ink-muted: #8e8e93;
    --paper: #faf9f7; --paper-warm: #f2efe9; --paper-dark: #e8e4dc;
    --accent: #3d5a3e; --accent-light: #e8f0e8; --accent-mid: #6b9e6c;
    --line: rgba(0,0,0,0.1); --radius: 4px; --radius-lg: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: linear-gradient(180deg, var(--paper) 0%, var(--paper-warm) 100%);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    position: relative;
    overflow: hidden;
  }

  /* decorative background circles, consistent with site style */
  .bg-circle {
    position: fixed;
    border-radius: 50%;
    border: 1px solid rgba(61,90,62,0.15);
    pointer-events: none;
  }
  .bg-circle.c1 { width: 420px; height: 420px; top: -140px; left: -140px; background: rgba(61,90,62,0.06); }
  .bg-circle.c2 { width: 300px; height: 300px; bottom: -100px; right: -100px; background: rgba(107,158,108,0.08); }
  .bg-circle.c3 { width: 160px; height: 160px; top: 20%; right: 8%; border-color: rgba(61,90,62,0.1); }

  .card {
    position: relative;
    z-index: 1;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    max-width: 460px;
    width: 100%;
    padding: 44px 32px 36px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(28,28,30,0.08);
  }

  .icon-badge {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: var(--accent-light);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
    font-size: 28px;
  }

  h1 {
    font-family: 'Noto Serif TC', serif;
    font-size: 22px;
    font-weight: 700;
    color: var(--ink);
    line-height: 1.5;
    margin-bottom: 12px;
  }

  p.desc {
    font-size: 14px;
    color: var(--ink-soft);
    line-height: 1.8;
    margin-bottom: 28px;
  }

  .new-url-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 16px 20px;
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    border-radius: 999px;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.02em;
    transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    box-shadow: 0 8px 20px rgba(61,90,62,0.25);
  }
  .new-url-btn:hover { background: #34503a; transform: translateY(-1px); box-shadow: 0 10px 24px rgba(61,90,62,0.32); }
  .new-url-btn:active { transform: translateY(0); }

  .url-hint {
    margin-top: 16px;
    font-size: 12px;
    color: var(--ink-muted);
    word-break: break-all;
  }

  .footer-note {
    margin-top: 28px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
    font-size: 12px;
    color: var(--ink-muted);
    line-height: 1.7;
  }
</style>
</head>
<body>

<div class="bg-circle c1"></div>
<div class="bg-circle c2"></div>
<div class="bg-circle c3"></div>

<div class="card">
  <div class="icon-badge">📍</div>
  <h1>報名網站換地方囉！<br>請至我們的新網站</h1>
  <p class="desc">為了提供更穩定、更完整的服務，線上課程報名系統已經搬家了。<br>請點擊下方按鈕前往新網站繼續報名。</p>

  <a class="new-url-btn" href="https://class-b0b02.web.app/" target="_self">
    前往新網站 →
  </a>
  <div class="url-hint">https://class-b0b02.web.app/</div>

  <div class="footer-note">
    社團法人中華恩典國際健康管理協會<br>
    若有任何問題，歡迎聯繫協會工作人員
  </div>
</div>

<script>
  // auto-redirect after a short delay, in case the visitor doesn't click
  setTimeout(function () {
    window.location.href = "https://class-b0b02.web.app/";
  }, 5000);
</script>

</body>
</html>
